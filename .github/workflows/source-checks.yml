name: Source regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python syntax
        run: python -m compileall -q Source/frontend Source/tests
      - name: Check independent arithmetic fixtures
        run: python Source/native/generate_diagnostic.py --check
      - name: Check completion publication and Windows sharing races
        run: python Source/tests/test_owner_publication.py
