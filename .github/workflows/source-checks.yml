name: Source regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python syntax
        run: python -m compileall -q Source/frontend Source/tests
      - name: Check independent arithmetic fixtures
        run: python Source/native/generate_diagnostic.py --check
      - name: Check standalone lifecycle, statistics and Windows process hosts
        run: python -m unittest discover -s Source/tests -p "test_*.py"
